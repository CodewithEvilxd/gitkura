<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitKura 蔵 • Git Repository Vault &amp; Cloud Sync</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-256.png" />
    <!-- Google Fonts: Authentic Colored Pencil & Handwriting Fonts (Cabin Sketch, Kalam, Patrick Hand, Architects Daughter, Gaegu, Nanum Pen Script, Caveat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=Cabin+Sketch:wght@400;700&family=Caveat:wght@600;700&family=Gaegu:wght@400;700&family=Gloria+Hallelujah&family=Gochi+Hand&family=JetBrains+Mono:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Kalam:wght@400;700&family=Nanum+Pen+Script&family=Patrick+Hand&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fdfbf7] text-[#2d2d2d] antialiased selection:bg-[#fef08a] selection:text-[#1a3a5f]">
    <!-- SVG Grain & Texture Filter for Realistic Colored Pencil Handwriting -->
    <svg width="0" height="0" class="absolute pointer-events-none" style="position: absolute; width: 0; height: 0;" aria-hidden="true">
      <defs>
        <filter id="pencil-texture" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
